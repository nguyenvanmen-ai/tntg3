      min-height: 100vh;
    }
    .option-card:hover {

<body class="py-6 px-4 sm:px-6 lg:px-8 flex flex-col items-center justify-center min-h-screen">

        Tổng số: <span id="total-q-count">0</span> câu hỏi

        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Tùy chọn chế độ làm bài</label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <label class="border border-gray-200 p-4 rounded-xl cursor-pointer hover:border-indigo-500 transition flex items-center space-x-3 bg-gray-50 hover:bg-indigo-50">

                <div class="font-semibold text-gray-800">Làm ngẫu nhiên 20 câu</div>
                <div class="text-xs text-gray-500">Phù hợp kiểm tra nhanh</div>
              </div>
            </label>

            <label class="border border-gray-200 p-4 rounded-xl cursor-pointer hover:border-indigo-500 transition flex items-center space-x-3 bg-gray-50 hover:bg-indigo-50">
              <input type="radio" name="quiz-mode" value="all" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500">

                <div class="font-semibold text-gray-800">Làm tất cả câu hỏi</div>

        <button id="btn-start" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg hover:shadow-xl transition transform active:scale-95 flex items-center justify-center space-x-2">

          <span id="timer-display">00:00</span>

      </div>

    </section>

    <section id="step-result" class="p-6 sm:p-8 hidden">

      </div>

    // APP STATE
    let currentQuestions = [];

    let timerInterval = null;

    // DOM ELEMENTS
    const totalQCountEl = document.getElementById('total-q-count');
    const stepSetup = document.getElementById('step-setup');
    const stepQuiz = document.getElementById('step-quiz');
    const stepResult = document.getElementById('step-result');
    const studentNameInput = document.getElementById('student-name');
    const nameError = document.getElementById('name-error');
    const btnStart = document.getElementById('btn-start');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const currentQNumEl = document.getElementById('current-q-num');
    const totalQSessionEl = document.getElementById('total-q-session');
    const timerDisplay = document.getElementById('timer-display');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnSubmit = document.getElementById('btn-submit');
    const btnRestart = document.getElementById('btn-restart');

    // INITIALIZE
    totalQCountEl.textContent = questionBank.length;

    // SHUFFLE ARRAY HELPER
    function shuffle(array) {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // START QUIZ
    btnStart.addEventListener('click', () => {
      studentName = studentNameInput.value.trim();
      if (!studentName) {
        nameError.classList.remove('hidden');
        return;
      }
      nameError.classList.add('hidden');

      const mode = document.querySelector('input[name="quiz-mode"]:checked').value;
      let rawQuestions = [...questionBank];

      if (mode === '20') {
        rawQuestions = shuffle(rawQuestions).slice(0, 20);
      } else {
        rawQuestions = shuffle(rawQuestions);
      }

      // Shuffle options for each question while preserving correct answer
      currentQuestions = rawQuestions.map(q => {
        let opts = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.answer }));
        opts = shuffle(opts);
        return {
          question: q.question,
          options: opts.map(o => o.text),
          answer: opts.findIndex(o => o.isCorrect)
        };
      });

      userAnswers = new Array(currentQuestions.length).fill(null);
      currentIdx = 0;
      secondsElapsed = 0;

      totalQSessionEl.textContent = currentQuestions.length;
      stepSetup.classList.add('hidden');
      stepQuiz.classList.remove('hidden');

      startTimer();
      renderQuestion();
    });

    // TIMER FUNCTION
    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
        const secs = (secondsElapsed % 60).toString().padStart(2, '0');
        timerDisplay.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    // RENDER QUESTION
    function renderQuestion() {
      const q = currentQuestions[currentIdx];
      currentQNumEl.textContent = currentIdx + 1;
      questionText.textContent = `${currentIdx + 1}. ${q.question}`;

      optionsContainer.innerHTML = '';
      q.options.forEach((optText, idx) => {
        const isSelected = userAnswers[currentIdx] === idx;
        const optCard = document.createElement('div');
        optCard.className = `option-card border border-gray-200 rounded-xl p-4 cursor-pointer transition flex items-start space-x-3 ${isSelected ? 'selected' : 'bg-white'}`;
        
        const optionChar = String.fromCharCode(65 + idx);
        optCard.innerHTML = `
          <div class="w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center font-semibold text-xs text-gray-600 flex-shrink-0 mt-0.5 ${isSelected ? 'border-indigo-600 bg-indigo-600 text-white' : ''}">
            ${optionChar}
          </div>
          <div class="text-gray-800 text-sm sm:text-base leading-relaxed">${optText}</div>
        `;

        optCard.addEventListener('click', () => {
          userAnswers[currentIdx] = idx;
          renderQuestion();
        });

        optionsContainer.appendChild(optCard);
      });

      // Update Navigation buttons
      btnPrev.disabled = currentIdx === 0;
      if (currentIdx === currentQuestions.length - 1) {
        btnNext.classList.add('hidden');
        btnSubmit.classList.remove('hidden');
      } else {
        btnNext.classList.remove('hidden');
        btnSubmit.classList.add('hidden');
      }
    }

    // NAVIGATION EVENT LISTENERS
    btnPrev.addEventListener('click', () => {
      if (currentIdx > 0) {
        currentIdx--;
        renderQuestion();
      }
    });

    btnNext.addEventListener('click', () => {
      if (currentIdx < currentQuestions.length - 1) {
        currentIdx++;
        renderQuestion();
      }
    });

    btnSubmit.addEventListener('click', finishQuiz);

    // FINISH AND SHOW RESULT
    function finishQuiz() {
      clearInterval(timerInterval);
      stepQuiz.classList.add('hidden');
      stepResult.classList.remove('hidden');

      let correctCount = 0;
      const wrongList = [];

      currentQuestions.forEach((q, idx) => {
        const uAns = userAnswers[idx];
        if (uAns === q.answer) {
          correctCount++;
        } else {
          wrongList.push({
            qNum: idx + 1,
            question: q.question,
            options: q.options,
            userAns: uAns,
            correctAns: q.answer
          });
        }
      });

      const total = currentQuestions.length;
      const percent = Math.round((correctCount / total) * 100);
      const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
      const secs = (secondsElapsed % 60).toString().padStart(2, '0');

      document.getElementById('result-student-name').textContent = studentName;
      document.getElementById('result-score').textContent = `${correctCount}/${total}`;
      document.getElementById('result-percent').textContent = `${percent}%`;
      document.getElementById('result-time').textContent = `${mins}:${secs}`;

      // Render Wrong Questions
      const wrongContainer = document.getElementById('wrong-questions-list');
      wrongContainer.innerHTML = '';

      if (wrongList.length === 0) {
        wrongContainer.innerHTML = `<div class="p-4 bg-emerald-50 text-emerald-700 rounded-xl text-center font-medium">Xuất sắc! Bạn đã trả lời đúng tất cả các câu hỏi.</div>`;
      } else {
        wrongList.forEach(item => {
          const itemEl = document.createElement('div');
          itemEl.className = 'border border-gray-200 rounded-xl p-4 bg-white space-y-2';
          
          let userAnsText = item.userAns !== null ? item.options[item.userAns] : 'Chưa chọn đáp án';
          let correctAnsText = item.options[item.correctAns];

          itemEl.innerHTML = `
            <div class="font-bold text-gray-800 text-sm sm:text-base">Câu ${item.qNum}: ${item.question}</div>
            <div class="text-xs sm:text-sm p-2.5 rounded-lg border wrong-ans">
              <span class="font-semibold">Bạn chọn:</span> ${userAnsText}
            </div>
            <div class="text-xs sm:text-sm p-2.5 rounded-lg border correct-ans">
              <span class="font-semibold">Đáp án đúng:</span> ${correctAnsText}
            </div>
          `;
          wrongContainer.appendChild(itemEl);
        });
      }
    }

    // RESTART
    btnRestart.addEventListener('click', () => {
      stepResult.classList.add('hidden');
      stepSetup.classList.remove('hidden');
    });
  </script>
</body>
</html>
